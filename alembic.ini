# Lets the plain `alembic` CLI work from the repo root. The canonical
# entrypoint is `python -m pipeline.migrate` (see that module for why).
# No database URL here on purpose: env.py builds it from POSTGRES_* env
# vars via pipeline.db.get_conn_params().
[alembic]
script_location = pipeline/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
