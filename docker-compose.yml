services:
  postgres:
    image: postgres:16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      POSTGRES_DB: rag_pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: rag-pipeline-airflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_pass@postgres/rag_pipeline
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-changeme123}
    entrypoint: /bin/bash
    # Standalone mode creates its own random admin user for browser login,
    # but the API container needs a STABLE, known set of credentials to
    # call Airflow's REST API programmatically -- so we create a second,
    # dedicated user here with a password from .env. "|| true" so this
    # doesn't fail the container on restarts where the user already exists.
    command: -c "airflow db init && airflow users create --username api_trigger --password \"$$AIRFLOW_API_PASSWORD\" --firstname API --lastname Trigger --role Admin --email api-trigger@rag-pipeline.local || true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: rag-pipeline-airflow:latest
    container_name: rag_airflow
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_pass@postgres/rag_pipeline
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      GITHUB_REPO: langchain-ai/langchain
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rag_pipeline
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      PYTHONPATH: /opt/airflow
      CHROMA_PERSIST_DIR: /opt/airflow/chroma_data
      MLFLOW_TRACKING_URI: sqlite:////opt/airflow/mlflow_data/mlflow.db
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./airflow_chroma_data:/opt/airflow/chroma_data
      - ./airflow_mlflow_data:/opt/airflow/mlflow_data
    command: standalone

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag_api
    depends_on:
      - airflow-webserver
    environment:
      GITHUB_REPO: langchain-ai/langchain
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      PORT: "8080"
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_API_USERNAME: api_trigger
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-changeme123}
    ports:
      - "8000:8080"
    volumes:
      # Same host folder Airflow writes to (see airflow-webserver above) --
      # mounted OVER the image's build-time chroma_data snapshot, so
      # anything ingested via Airflow (including from the UI's "New repo"
      # trigger) is immediately visible here without a rebuild. Without
      # this, the API's Chroma data would be frozen at whatever
      # ./chroma_data looked like when the image was last built --
      # exactly the bug that made microsoft/vscode invisible after
      # triggering its ingestion through the UI.
      - ./airflow_chroma_data:/app/chroma_data

volumes:
  pgdata: