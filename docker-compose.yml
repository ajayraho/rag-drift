services:
  postgres:
    image: postgres:16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      POSTGRES_DB: rag_pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A real Chroma SERVER instead of two separate processes (Airflow, API)
  # each opening their own file-based client against the same shared
  # directory -- that pattern is explicitly not safe for concurrent
  # multi-process access and caused two distinct internal Chroma errors
  # in practice ("Error finding id" locally, "Nothing found on disk" on
  # this deployment). A server handles concurrent access correctly, by
  # design. Reuses the EXISTING airflow_chroma_data directory as its data
  # volume -- Chroma's server mode uses the same on-disk file format as
  # the file-based client, so already-embedded data should be picked up
  # as-is, no re-ingestion needed.
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: rag_chromadb
    volumes:
      - ./airflow_chroma_data:/data
    ports:
      - "8001:8000"
    healthcheck:
      disable: true

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: rag-pipeline-airflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_pass@postgres/rag_pipeline
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-changeme123}
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username api_trigger --password \"$$AIRFLOW_API_PASSWORD\" --firstname API --lastname Trigger --role Admin --email api-trigger@rag-pipeline.local || true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: rag-pipeline-airflow:latest
    container_name: rag_airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      chromadb:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_pass@postgres/rag_pipeline
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      GITHUB_REPO: langchain-ai/langchain
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rag_pipeline
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      PYTHONPATH: /opt/airflow
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MLFLOW_TRACKING_URI: sqlite:////opt/airflow/mlflow_data/mlflow.db
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./airflow_mlflow_data:/opt/airflow/mlflow_data
    command: standalone
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: rag-drift-api
    container_name: rag_api
    depends_on:
      chromadb:
        condition: service_started
    environment:
      GITHUB_REPO: langchain-ai/langchain
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      PORT: "8080"
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_API_USERNAME: api_trigger
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-changeme123}
    ports:
      - "8000:8080"
    restart: unless-stopped

volumes:
  pgdata: