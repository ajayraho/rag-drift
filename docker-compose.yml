services:
  postgres:
    image: postgres:16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      POSTGRES_DB: rag_pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: rag-pipeline-airflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_pass@postgres/rag_pipeline
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: /bin/bash
    command: -c "airflow db init"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: rag-pipeline-airflow:latest
    container_name: rag_airflow
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag_user:rag_pass@postgres/rag_pipeline
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GITHUB_REPO: langchain-ai/langchain
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rag_pipeline
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      PYTHONPATH: /opt/airflow
      CHROMA_PERSIST_DIR: /opt/airflow/chroma_data
      MLFLOW_TRACKING_URI: sqlite:////opt/airflow/mlflow_data/mlflow.db
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./airflow_chroma_data:/opt/airflow/chroma_data
      - ./airflow_mlflow_data:/opt/airflow/mlflow_data
    command: standalone

volumes:
  pgdata: